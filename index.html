<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BungeeLab | Скоро</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange-start: #FF9A00;
            --orange-end: #FF3C00;
            --text-main: #111111;
            --text-muted: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 154, 0, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s ease-out;
        }

        .logo {
            font-size: clamp(8rem, 25vw, 14rem);
            font-weight: 800;
            line-height: 0.8;
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--orange-start) 0%, var(--orange-end) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 15px 25px rgba(255, 60, 0, 0.15));
            margin-bottom: 10px;
        }

        .brand-name {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .slogan {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 600;
            color: var(--orange-end);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #f7f7f7;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: clamp(0.85rem, 2vw, 1rem);
            font-weight: 600;
            color: var(--text-muted);
            border: 1px solid #ebebeb;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: var(--orange-start);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 154, 0, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(255, 154, 0, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 154, 0, 0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .status {
                padding: 10px 18px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">B</div>
        <h1 class="brand-name">BungeeLab</h1>
        <p class="slogan">Создаём новое</p>
        
        <div class="status">
            <span class="dot"></span>
            Тут скоро что-то будет...
        </div>
    </div>

</body>
</html>
