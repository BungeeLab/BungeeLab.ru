<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | BungeeLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange-start: #FF9A00;
            --orange-end: #FF3C00;
            --text-main: #111111;
            --text-muted: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 154, 0, 0.05) 0%, transparent 60%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            /* Убирает выделение текста на всей странице при быстрых кликах */
            -webkit-tap-highlight-color: transparent; 
        }

        .container {
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s ease-out;
        }

        .error-code {
            font-size: clamp(8rem, 30vw, 16rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -4px;
            background: linear-gradient(135deg, var(--orange-start) 0%, var(--orange-end) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 15px 25px rgba(255, 60, 0, 0.15));
            margin-bottom: -10px;
            animation: float 4s ease-in-out infinite;
        }

        .title {
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .description {
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            color: var(--text-muted);
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            font-size: clamp(0.9rem, 2vw, 1rem);
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, var(--orange-start) 0%, var(--orange-end) 100%);
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 60, 0, 0.2);
            
            /* Убираем синюю рамку/фон при тапе на телефоне */
            -webkit-tap-highlight-color: transparent;
            /* Запрещаем выделять текст кнопки */
            -webkit-user-select: none;
            user-select: none;
            /* Убираем стандартную обводку при фокусе */
            outline: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 60, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">404</div>
        <h1 class="title">Страница не найдена</h1>
        <p class="description">Кажется, этот эксперимент провалился, и запрашиваемая страница потерялась где-то в нашей лаборатории.</p>
        <a href="/" class="btn">Вернуться на главную</a>
    </div>

</body>
</html>
